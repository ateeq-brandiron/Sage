<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" fill="none">
  <defs>
    <!-- Dollar bill texture pattern for bars -->
    <pattern id="texture1" patternUnits="userSpaceOnUse" width="8" height="8">
      <rect width="8" height="8" fill="#8FAF9A"/>
      <line x1="0" y1="0" x2="8" y2="8" stroke="#7A9C85" stroke-width="0.4" opacity="0.5"/>
      <line x1="0" y1="4" x2="4" y2="8" stroke="#7A9C85" stroke-width="0.3" opacity="0.4"/>
      <line x1="4" y1="0" x2="8" y2="4" stroke="#7A9C85" stroke-width="0.3" opacity="0.4"/>
    </pattern>
    <pattern id="texture2" patternUnits="userSpaceOnUse" width="10" height="10">
      <rect width="10" height="10" fill="#8AAF95"/>
      <line x1="0" y1="0" x2="10" y2="10" stroke="#6E9278" stroke-width="0.5" opacity="0.5"/>
      <line x1="0" y1="5" x2="5" y2="10" stroke="#6E9278" stroke-width="0.3" opacity="0.4"/>
      <line x1="5" y1="0" x2="10" y2="5" stroke="#6E9278" stroke-width="0.3" opacity="0.4"/>
    </pattern>
    <pattern id="texture3" patternUnits="userSpaceOnUse" width="12" height="12">
      <rect width="12" height="12" fill="#85AA90"/>
      <circle cx="6" cy="6" r="3.5" fill="none" stroke="#6A8E74" stroke-width="0.6" opacity="0.5"/>
      <circle cx="6" cy="6" r="2" fill="none" stroke="#6A8E74" stroke-width="0.5" opacity="0.4"/>
      <line x1="0" y1="0" x2="12" y2="12" stroke="#6A8E74" stroke-width="0.3" opacity="0.3"/>
      <line x1="12" y1="0" x2="0" y2="12" stroke="#6A8E74" stroke-width="0.3" opacity="0.3"/>
    </pattern>
    <pattern id="texture4" patternUnits="userSpaceOnUse" width="10" height="10">
      <rect width="10" height="10" fill="#82A88D"/>
      <line x1="0" y1="2" x2="10" y2="2" stroke="#6A9076" stroke-width="0.4" opacity="0.5"/>
      <line x1="0" y1="6" x2="10" y2="6" stroke="#6A9076" stroke-width="0.4" opacity="0.4"/>
      <line x1="2" y1="0" x2="2" y2="10" stroke="#6A9076" stroke-width="0.3" opacity="0.3"/>
      <line x1="6" y1="0" x2="6" y2="10" stroke="#6A9076" stroke-width="0.3" opacity="0.3"/>
    </pattern>
    <pattern id="texture5" patternUnits="userSpaceOnUse" width="14" height="14">
      <rect width="14" height="14" fill="#7FA58A"/>
      <circle cx="7" cy="7" r="5" fill="none" stroke="#658C70" stroke-width="0.7" opacity="0.5"/>
      <circle cx="7" cy="7" r="3" fill="none" stroke="#658C70" stroke-width="0.5" opacity="0.4"/>
      <circle cx="7" cy="7" r="1.5" fill="none" stroke="#658C70" stroke-width="0.5" opacity="0.4"/>
      <line x1="0" y1="0" x2="14" y2="14" stroke="#658C70" stroke-width="0.3" opacity="0.3"/>
      <line x1="14" y1="0" x2="0" y2="14" stroke="#658C70" stroke-width="0.3" opacity="0.3"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="560" fill="#F4F5F0" rx="4"/>

  <!-- WEALTH axis label top right -->
  <text x="690" y="60" font-family="'Georgia', serif" font-size="18" font-weight="700" fill="#2D3E35" letter-spacing="2">WEALTH</text>
  <!-- Wealth arrow (triangle pointing up) -->
  <polygon points="672,44 680,60 664,60" fill="#2D3E35"/>

  <!-- TIME axis label bottom left -->
  <text x="60" y="500" font-family="'Georgia', serif" font-size="18" font-weight="700" fill="#2D3E35" letter-spacing="2">TIME</text>
  <!-- Time arrow (triangle pointing right) -->
  <polygon points="136,490 136,506 148,498" fill="#2D3E35"/>

  <!-- Baseline -->
  <line x1="60" y1="478" x2="740" y2="478" stroke="#2D3E35" stroke-width="1.5" opacity="0.3"/>

  <!-- Bar 1 — shortest -->
  <rect x="155" y="388" width="90" height="90" fill="url(#texture1)"/>
  <rect x="155" y="388" width="90" height="90" fill="none" stroke="#6A9276" stroke-width="0.5" opacity="0.3"/>

  <!-- Bar 2 -->
  <rect x="275" y="318" width="90" height="160" fill="url(#texture2)"/>
  <rect x="275" y="318" width="90" height="160" fill="none" stroke="#6A9276" stroke-width="0.5" opacity="0.3"/>

  <!-- Bar 3 — middle (eye visible area) -->
  <rect x="395" y="228" width="90" height="250" fill="url(#texture3)"/>
  <!-- Eye detail on bar 3 -->
  <ellipse cx="440" cy="360" rx="28" ry="18" fill="none" stroke="#4A7558" stroke-width="1.2" opacity="0.6"/>
  <ellipse cx="440" cy="360" rx="16" ry="10" fill="none" stroke="#4A7558" stroke-width="1" opacity="0.55"/>
  <ellipse cx="440" cy="360" rx="7" ry="5" fill="#4A7558" opacity="0.25"/>
  <!-- Concentric rings around eye -->
  <ellipse cx="440" cy="360" rx="36" ry="24" fill="none" stroke="#4A7558" stroke-width="0.7" opacity="0.35"/>
  <ellipse cx="440" cy="360" rx="44" ry="30" fill="none" stroke="#4A7558" stroke-width="0.5" opacity="0.25"/>
  <rect x="395" y="228" width="90" height="250" fill="none" stroke="#6A9276" stroke-width="0.5" opacity="0.3"/>

  <!-- Bar 4 -->
  <rect x="515" y="168" width="90" height="310" fill="url(#texture4)"/>
  <!-- Eye hint on bar 4 -->
  <ellipse cx="560" cy="290" rx="22" ry="14" fill="none" stroke="#4A7558" stroke-width="0.9" opacity="0.45"/>
  <ellipse cx="560" cy="290" rx="12" ry="8" fill="none" stroke="#4A7558" stroke-width="0.7" opacity="0.4"/>
  <ellipse cx="560" cy="290" rx="5" ry="4" fill="#4A7558" opacity="0.2"/>
  <rect x="515" y="168" width="90" height="310" fill="none" stroke="#6A9276" stroke-width="0.5" opacity="0.3"/>

  <!-- Bar 5 — tallest (partial, cut at top) -->
  <rect x="635" y="88" width="90" height="390" fill="url(#texture5)"/>
  <!-- Eye hint on bar 5 -->
  <ellipse cx="680" cy="220" rx="26" ry="16" fill="none" stroke="#4A7558" stroke-width="1" opacity="0.4"/>
  <ellipse cx="680" cy="220" rx="14" ry="9" fill="none" stroke="#4A7558" stroke-width="0.8" opacity="0.38"/>
  <ellipse cx="680" cy="220" rx="6" ry="4" fill="#4A7558" opacity="0.2"/>
  <rect x="635" y="88" width="90" height="390" fill="none" stroke="#6A9276" stroke-width="0.5" opacity="0.3"/>
</svg>
