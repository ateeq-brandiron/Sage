<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 480" fill="none">
  <defs>
    <pattern id="hatch" patternUnits="userSpaceOnUse" width="4" height="4">
      <rect width="4" height="4" fill="#8FA896"/>
      <line x1="0" y1="0" x2="4" y2="4" stroke="#6B8472" stroke-width="0.5" opacity="0.6"/>
      <line x1="4" y1="0" x2="0" y2="4" stroke="#6B8472" stroke-width="0.5" opacity="0.4"/>
    </pattern>
    <pattern id="engrave" patternUnits="userSpaceOnUse" width="3" height="3">
      <rect width="3" height="3" fill="#8AAF95"/>
      <line x1="0" y1="1.5" x2="3" y2="1.5" stroke="#5C8068" stroke-width="0.6" opacity="0.5"/>
    </pattern>
    <pattern id="thread" patternUnits="userSpaceOnUse" width="6" height="6">
      <rect width="6" height="6" fill="#87AA92"/>
      <line x1="0" y1="0" x2="6" y2="6" stroke="#4E7560" stroke-width="0.6" opacity="0.55"/>
      <line x1="0" y1="3" x2="3" y2="6" stroke="#4E7560" stroke-width="0.4" opacity="0.4"/>
      <line x1="3" y1="0" x2="6" y2="3" stroke="#4E7560" stroke-width="0.4" opacity="0.4"/>
    </pattern>
    <pattern id="grid" patternUnits="userSpaceOnUse" width="8" height="8">
      <rect width="8" height="8" fill="#84A88F"/>
      <line x1="0" y1="2" x2="8" y2="2" stroke="#567A62" stroke-width="0.5" opacity="0.5"/>
      <line x1="0" y1="6" x2="8" y2="6" stroke="#567A62" stroke-width="0.5" opacity="0.4"/>
      <line x1="2" y1="0" x2="2" y2="8" stroke="#567A62" stroke-width="0.4" opacity="0.4"/>
      <line x1="6" y1="0" x2="6" y2="8" stroke="#567A62" stroke-width="0.4" opacity="0.4"/>
    </pattern>
    <pattern id="stipple" patternUnits="userSpaceOnUse" width="5" height="5">
      <rect width="5" height="5" fill="#82A68D"/>
      <circle cx="1.5" cy="1.5" r="0.6" fill="#4A7358" opacity="0.5"/>
      <circle cx="3.5" cy="3.5" r="0.6" fill="#4A7358" opacity="0.5"/>
      <line x1="0" y1="0" x2="5" y2="5" stroke="#4A7358" stroke-width="0.4" opacity="0.3"/>
    </pattern>
  </defs>

  <!-- Bar 1 — shortest -->
  <rect x="20"  y="420" width="76" height="56"  fill="url(#hatch)"   rx="2"/>

  <!-- Bar 2 -->
  <rect x="116" y="340" width="76" height="136" fill="url(#engrave)" rx="2"/>

  <!-- Bar 3 — eye area -->
  <rect x="212" y="236" width="76" height="240" fill="url(#thread)"  rx="2"/>
  <ellipse cx="250" cy="358" rx="26" ry="17" fill="none" stroke="#3A6048" stroke-width="1.4" opacity="0.7"/>
  <ellipse cx="250" cy="358" rx="15" ry="10" fill="none" stroke="#3A6048" stroke-width="1.1" opacity="0.65"/>
  <ellipse cx="250" cy="358" rx="7"  ry="5"  fill="#3A6048" opacity="0.35"/>
  <ellipse cx="250" cy="358" rx="34" ry="22" fill="none" stroke="#3A6048" stroke-width="0.7" opacity="0.35"/>
  <ellipse cx="250" cy="358" rx="42" ry="28" fill="none" stroke="#3A6048" stroke-width="0.5" opacity="0.22"/>

  <!-- Bar 4 -->
  <rect x="308" y="160" width="76" height="316" fill="url(#grid)"    rx="2"/>
  <ellipse cx="346" cy="290" rx="20" ry="13" fill="none" stroke="#3A6048" stroke-width="1" opacity="0.40"/>
  <ellipse cx="346" cy="290" rx="11" ry="7"  fill="none" stroke="#3A6048" stroke-width="0.8" opacity="0.35"/>
  <ellipse cx="346" cy="290" rx="5"  ry="3"  fill="#3A6048" opacity="0.22"/>

  <!-- Bar 5 — tallest -->
  <rect x="404" y="60"  width="76" height="416" fill="url(#stipple)" rx="2"/>
  <ellipse cx="442" cy="200" rx="22" ry="14" fill="none" stroke="#3A6048" stroke-width="0.9" opacity="0.38"/>
  <ellipse cx="442" cy="200" rx="12" ry="8"  fill="none" stroke="#3A6048" stroke-width="0.7" opacity="0.32"/>
  <ellipse cx="442" cy="200" rx="5"  ry="3"  fill="#3A6048" opacity="0.20"/>

  <!-- Baseline -->
  <line x1="10" y1="477" x2="490" y2="477" stroke="#9BB5A5" stroke-width="1.5" opacity="0.4"/>
  <rect x="20"  y="474" width="76" height="3" fill="#8AA095" rx="1" opacity="0.3"/>
  <rect x="116" y="474" width="76" height="3" fill="#8AA095" rx="1" opacity="0.3"/>
  <rect x="212" y="474" width="76" height="3" fill="#8AA095" rx="1" opacity="0.3"/>
  <rect x="308" y="474" width="76" height="3" fill="#8AA095" rx="1" opacity="0.3"/>
  <rect x="404" y="474" width="76" height="3" fill="#8AA095" rx="1" opacity="0.3"/>
</svg>
