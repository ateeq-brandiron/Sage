<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 790 800" fill="none">
  <defs>
    <pattern id="hatch" patternUnits="userSpaceOnUse" width="4" height="4">
      <rect width="4" height="4" fill="#8FA896"/>
      <line x1="0" y1="0" x2="4" y2="4" stroke="#6B8472" stroke-width="0.5" opacity="0.6"/>
      <line x1="4" y1="0" x2="0" y2="4" stroke="#6B8472" stroke-width="0.5" opacity="0.4"/>
    </pattern>
    <pattern id="engrave" patternUnits="userSpaceOnUse" width="3" height="3">
      <rect width="3" height="3" fill="#8AAF95"/>
      <line x1="0" y1="1.5" x2="3" y2="1.5" stroke="#5C8068" stroke-width="0.6" opacity="0.5"/>
    </pattern>
    <pattern id="thread" patternUnits="userSpaceOnUse" width="6" height="6">
      <rect width="6" height="6" fill="#87AA92"/>
      <line x1="0" y1="0" x2="6" y2="6" stroke="#4E7560" stroke-width="0.6" opacity="0.55"/>
      <line x1="0" y1="3" x2="3" y2="6" stroke="#4E7560" stroke-width="0.4" opacity="0.4"/>
      <line x1="3" y1="0" x2="6" y2="3" stroke="#4E7560" stroke-width="0.4" opacity="0.4"/>
    </pattern>
    <pattern id="grid" patternUnits="userSpaceOnUse" width="8" height="8">
      <rect width="8" height="8" fill="#84A88F"/>
      <line x1="0" y1="2" x2="8" y2="2" stroke="#567A62" stroke-width="0.5" opacity="0.5"/>
      <line x1="0" y1="6" x2="8" y2="6" stroke="#567A62" stroke-width="0.5" opacity="0.4"/>
      <line x1="2" y1="0" x2="2" y2="8" stroke="#567A62" stroke-width="0.4" opacity="0.4"/>
      <line x1="6" y1="0" x2="6" y2="8" stroke="#567A62" stroke-width="0.4" opacity="0.4"/>
    </pattern>
    <pattern id="stipple" patternUnits="userSpaceOnUse" width="5" height="5">
      <rect width="5" height="5" fill="#82A68D"/>
      <circle cx="1.5" cy="1.5" r="0.6" fill="#4A7358" opacity="0.5"/>
      <circle cx="3.5" cy="3.5" r="0.6" fill="#4A7358" opacity="0.5"/>
      <line x1="0" y1="0" x2="5" y2="5" stroke="#4A7358" stroke-width="0.4" opacity="0.3"/>
    </pattern>
  </defs>

  <!-- All bars bottom-aligned at y=790 -->

  <!-- Bar 1 — shortest: h=102, y=688, centre x=79 -->
  <rect x="10"  y="688" width="138" height="102" fill="url(#hatch)"   rx="2"/>

  <!-- Bar 2: h=248, y=542, centre x=237 -->
  <rect x="168" y="542" width="138" height="248" fill="url(#engrave)" rx="2"/>

  <!-- Bar 3 — eye bar: h=438, y=352, centre x=395 -->
  <rect x="326" y="352" width="138" height="438" fill="url(#thread)"  rx="2"/>
  <ellipse cx="395" cy="575" rx="28" ry="18" fill="none" stroke="#3A6048" stroke-width="1.4" opacity="0.7"/>
  <ellipse cx="395" cy="575" rx="16" ry="10" fill="none" stroke="#3A6048" stroke-width="1.1" opacity="0.65"/>
  <ellipse cx="395" cy="575" rx="7"  ry="5"  fill="#3A6048" opacity="0.35"/>
  <ellipse cx="395" cy="575" rx="37" ry="24" fill="none" stroke="#3A6048" stroke-width="0.7" opacity="0.32"/>
  <ellipse cx="395" cy="575" rx="46" ry="30" fill="none" stroke="#3A6048" stroke-width="0.5" opacity="0.20"/>

  <!-- Bar 4: h=577, y=213, centre x=553 -->
  <rect x="484" y="213" width="138" height="577" fill="url(#grid)"    rx="2"/>
  <ellipse cx="553" cy="450" rx="22" ry="14" fill="none" stroke="#3A6048" stroke-width="1"   opacity="0.38"/>
  <ellipse cx="553" cy="450" rx="12" ry="8"  fill="none" stroke="#3A6048" stroke-width="0.8" opacity="0.32"/>
  <ellipse cx="553" cy="450" rx="5"  ry="3"  fill="#3A6048" opacity="0.20"/>

  <!-- Bar 5 — tallest: h=760, y=30, centre x=711 -->
  <rect x="642" y="30"  width="138" height="760" fill="url(#stipple)" rx="2"/>
  <ellipse cx="711" cy="288" rx="24" ry="15" fill="none" stroke="#3A6048" stroke-width="0.9" opacity="0.36"/>
  <ellipse cx="711" cy="288" rx="13" ry="8"  fill="none" stroke="#3A6048" stroke-width="0.7" opacity="0.30"/>
  <ellipse cx="711" cy="288" rx="5"  ry="3"  fill="#3A6048" opacity="0.18"/>
</svg>
