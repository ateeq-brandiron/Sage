<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 480" fill="none">
  <defs>
    <pattern id="hatch" patternUnits="userSpaceOnUse" width="4" height="4">
      <rect width="4" height="4" fill="#8FA896"/>
      <line x1="0" y1="0" x2="4" y2="4" stroke="#6B8472" stroke-width="0.5" opacity="0.6"/>
      <line x1="4" y1="0" x2="0" y2="4" stroke="#6B8472" stroke-width="0.5" opacity="0.4"/>
    </pattern>
    <pattern id="engrave" patternUnits="userSpaceOnUse" width="3" height="3">
      <rect width="3" height="3" fill="#8AAF95"/>
      <line x1="0" y1="1.5" x2="3" y2="1.5" stroke="#5C8068" stroke-width="0.6" opacity="0.5"/>
    </pattern>
    <pattern id="thread" patternUnits="userSpaceOnUse" width="6" height="6">
      <rect width="6" height="6" fill="#87AA92"/>
      <line x1="0" y1="0" x2="6" y2="6" stroke="#4E7560" stroke-width="0.6" opacity="0.55"/>
      <line x1="0" y1="3" x2="3" y2="6" stroke="#4E7560" stroke-width="0.4" opacity="0.4"/>
      <line x1="3" y1="0" x2="6" y2="3" stroke="#4E7560" stroke-width="0.4" opacity="0.4"/>
    </pattern>
    <pattern id="grid" patternUnits="userSpaceOnUse" width="8" height="8">
      <rect width="8" height="8" fill="#84A88F"/>
      <line x1="0" y1="2" x2="8" y2="2" stroke="#567A62" stroke-width="0.5" opacity="0.5"/>
      <line x1="0" y1="6" x2="8" y2="6" stroke="#567A62" stroke-width="0.5" opacity="0.4"/>
      <line x1="2" y1="0" x2="2" y2="8" stroke="#567A62" stroke-width="0.4" opacity="0.4"/>
      <line x1="6" y1="0" x2="6" y2="8" stroke="#567A62" stroke-width="0.4" opacity="0.4"/>
    </pattern>
    <pattern id="stipple" patternUnits="userSpaceOnUse" width="5" height="5">
      <rect width="5" height="5" fill="#82A68D"/>
      <circle cx="1.5" cy="1.5" r="0.6" fill="#4A7358" opacity="0.5"/>
      <circle cx="3.5" cy="3.5" r="0.6" fill="#4A7358" opacity="0.5"/>
      <line x1="0" y1="0" x2="5" y2="5" stroke="#4A7358" stroke-width="0.4" opacity="0.3"/>
    </pattern>
  </defs>

  <!-- Bar 1 — shortest: x=10, w=120, centre=70 -->
  <rect x="10"  y="420" width="120" height="56"  fill="url(#hatch)"   rx="2"/>

  <!-- Bar 2: x=150, w=120, centre=210 -->
  <rect x="150" y="340" width="120" height="136" fill="url(#engrave)" rx="2"/>

  <!-- Bar 3 — eye bar: x=290, w=120, centre=350 -->
  <rect x="290" y="236" width="120" height="240" fill="url(#thread)"  rx="2"/>
  <ellipse cx="350" cy="358" rx="32" ry="20" fill="none" stroke="#3A6048" stroke-width="1.4" opacity="0.7"/>
  <ellipse cx="350" cy="358" rx="18" ry="11" fill="none" stroke="#3A6048" stroke-width="1.1" opacity="0.65"/>
  <ellipse cx="350" cy="358" rx="8"  ry="5"  fill="#3A6048" opacity="0.35"/>
  <ellipse cx="350" cy="358" rx="42" ry="26" fill="none" stroke="#3A6048" stroke-width="0.7" opacity="0.32"/>
  <ellipse cx="350" cy="358" rx="52" ry="33" fill="none" stroke="#3A6048" stroke-width="0.5" opacity="0.20"/>

  <!-- Bar 4: x=430, w=120, centre=490 -->
  <rect x="430" y="160" width="120" height="316" fill="url(#grid)"    rx="2"/>
  <ellipse cx="490" cy="290" rx="26" ry="16" fill="none" stroke="#3A6048" stroke-width="1"   opacity="0.38"/>
  <ellipse cx="490" cy="290" rx="14" ry="9"  fill="none" stroke="#3A6048" stroke-width="0.8" opacity="0.32"/>
  <ellipse cx="490" cy="290" rx="6"  ry="4"  fill="#3A6048" opacity="0.20"/>

  <!-- Bar 5 — tallest: x=570, w=120, centre=630 -->
  <rect x="570" y="60"  width="120" height="416" fill="url(#stipple)" rx="2"/>
  <ellipse cx="630" cy="200" rx="28" ry="17" fill="none" stroke="#3A6048" stroke-width="0.9" opacity="0.36"/>
  <ellipse cx="630" cy="200" rx="15" ry="9"  fill="none" stroke="#3A6048" stroke-width="0.7" opacity="0.30"/>
  <ellipse cx="630" cy="200" rx="6"  ry="4"  fill="#3A6048" opacity="0.18"/>
</svg>
